<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Saaif's Portfolio — Mohamed Saaif Samsath</title>
  <meta name="description" content="Portfolio of Mohamed Saaif Samsath — Operations & Data Analyst, MBA Fintech and Data Analytics candidate." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ----- REFINED LIGHT THEME — MORE ATTRACTIVE ----- */
    :root{
      --bg: #F5F7FA;
      --surface: #FFFFFF;
      --surface-2: #EDF1F7;
      --line: #DCE3EC;
      --ink: #1A2634;
      --ink-dim: #3E4F62;
      --ink-faint: #7B8DA0;
      --gold: #C69B4A;
      --gold-soft: #E8D5B0;
      --mint: #0F7B5C;
      --font-display: "Fraunces", Georgia, serif;
      --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "IBM Plex Mono", "Courier New", monospace;
      --max: 1120px;
      --shadow-soft: 0 6px 18px rgba(0,0,0,0.04), 0 2px 4px rgba(0,0,0,0.02);
      --shadow-hover: 0 12px 32px rgba(0,0,0,0.06), 0 4px 8px rgba(0,0,0,0.02);
      --radius: 8px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    *{margin:0;padding:0;box-sizing:border-box;}
    html{scroll-behavior:smooth; -webkit-tap-highlight-color: transparent;}
    body{
      background:var(--bg);
      color:var(--ink);
      font-family:var(--font-body);
      line-height:1.7;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      overflow-x:hidden;
    }
    @media (prefers-reduced-motion: reduce){
      html{scroll-behavior:auto;}
      *{animation-duration:0.01ms !important; animation-iteration-count:1 !important; scroll-behavior:auto !important;}
    }

    a{color:inherit; transition:color .2s; -webkit-touch-callout:none;}
    ::selection{background:var(--gold); color:#FFFFFF;}
    :focus-visible{outline:2px solid var(--gold); outline-offset:3px;}

    .wrap{max-width:var(--max); margin:0 auto; padding:0 32px;}
    @media (max-width:640px){ .wrap{padding:0 12px;} }

    .eyebrow{
      font-family:var(--font-mono);
      font-size:10px;
      letter-spacing:.14em;
      text-transform:uppercase;
      color:var(--gold);
      font-weight:500;
    }
    @media (min-width:640px){
      .eyebrow{font-size:11px; letter-spacing:.16em;}
    }

    /* ---------- NAV / TABS - ALWAYS VISIBLE ---------- */
    header.site{
      position:sticky; top:0; z-index:1000;
      background:rgba(245,247,250,.96);
      backdrop-filter:blur(12px);
      -webkit-backdrop-filter:blur(12px);
      border-bottom:1px solid var(--line);
      transition: box-shadow .2s;
      padding-top: var(--safe-top);
    }
    header.site.scrolled{ box-shadow: var(--shadow-soft); }
    nav{
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:6px 8px 4px;
      max-width:var(--max);
      margin:0 auto;
      gap:4px;
    }
    @media (min-width:480px){
      nav{padding:8px 12px 6px; gap:6px;}
    }
    @media (min-width:721px){
      nav{flex-direction:row; justify-content:space-between; padding:12px 32px 10px; gap:0;}
    }

    .brand{
      font-family:var(--font-display);
      font-size:15px;
      font-weight:600;
      letter-spacing:-.01em;
      white-space:nowrap;
      width:100%;
      text-align:center;
    }
    @media (min-width:480px){
      .brand{font-size:17px;}
    }
    @media (min-width:721px){
      .brand{font-size:20px; width:auto; text-align:left;}
    }
    .brand span{color:var(--gold);}
    @media (max-width:380px){ .brand{font-size:13px;} }

    /* Navigation tabs - ALWAYS VISIBLE on all devices */
    .nav-links{
      display:flex;
      gap:3px;
      list-style:none;
      flex-wrap:wrap;
      justify-content:center;
      width:100%;
      padding:2px 0;
    }
    @media (min-width:480px){
      .nav-links{gap:4px; padding:4px 0;}
    }
    @media (min-width:721px){
      .nav-links{width:auto; gap:6px; padding:0; flex-wrap:nowrap;}
    }
    .nav-links button{
      font-family:var(--font-mono);
      font-size:9px;
      text-transform:uppercase;
      letter-spacing:.03em;
      color:var(--ink-dim);
      background:none;
      border:1px solid transparent;
      padding:4px 8px;
      cursor:pointer;
      transition:all .2s;
      border-radius:16px;
      font-weight:500;
      -webkit-touch-callout:none;
      touch-action:manipulation;
      white-space:nowrap;
      min-height:28px;
    }
    @media (min-width:480px){
      .nav-links button{font-size:10px; padding:5px 10px; min-height:32px;}
    }
    @media (min-width:640px){
      .nav-links button{font-size:11px; padding:6px 14px; min-height:36px;}
    }
    @media (min-width:721px){
      .nav-links button{font-size:12px; padding:8px 16px; letter-spacing:.08em; min-height:auto;}
    }
    .nav-links button:active{transform:scale(0.95);}
    .nav-links button:hover{color:var(--ink); background:var(--surface-2);}
    .nav-links button.active{
      color:var(--gold);
      border-color:var(--gold-soft);
      background:var(--surface);
      box-shadow: var(--shadow-soft);
    }

    .nav-toggle{display:none !important;}

    /* ---------- HERO - Only visible on About tab ---------- */
    .hero{
      padding:20px 0 16px;
      border-bottom:1px solid var(--line);
      position:relative;
    }
    @media (min-width:480px){
      .hero{padding:32px 0 20px;}
    }
    @media (min-width:640px){
      .hero{padding:60px 0 40px;}
    }
    @media (min-width:1024px){
      .hero{padding:80px 0 48px;}
    }
    .hero-grid{
      display:grid; grid-template-columns:1fr; gap:16px; align-items:start;
    }
    @media (min-width:480px){
      .hero-grid{gap:20px;}
    }
    @media (min-width:640px){
      .hero-grid{gap:24px;}
    }
    @media (min-width:860px){ 
      .hero-grid{grid-template-columns:1.5fr 1fr; gap:40px; align-items:end;}
    }
    @media (min-width:1024px){
      .hero-grid{gap:56px;}
    }

    .hero h1{
      font-family:var(--font-display);
      font-weight:600;
      font-size:clamp(22px, 4.5vw, 68px);
      line-height:1.05;
      letter-spacing:-.02em;
      margin:4px 0 8px;
    }
    @media (min-width:480px){
      .hero h1{font-size:clamp(26px, 5vw, 68px); margin:8px 0 10px;}
    }
    @media (min-width:640px){
      .hero h1{margin:14px 0 18px;}
    }
    .hero h1 em{
      font-style:italic; color:var(--gold); font-weight:500;
      position:relative;
    }
    .hero h1 em::after{
      content:''; position:absolute; left:0; bottom:-2px; width:100%; height:3px;
      background:var(--gold-soft); border-radius:4px; opacity:0.5;
    }
    .hero p.lede{
      font-size:13px; color:var(--ink-dim); max-width:52ch; line-height:1.5;
    }
    @media (min-width:480px){
      .hero p.lede{font-size:14px; line-height:1.6;}
    }
    @media (min-width:640px){
      .hero p.lede{font-size:17px; line-height:1.7;}
    }

    .hero-meta{
      font-family:var(--font-mono); font-size:9px; color:var(--ink-dim);
      border-left:2px solid var(--gold-soft); padding-left:10px;
      display:flex; flex-direction:column; gap:4px;
      background:var(--surface); padding:10px 10px 10px 14px;
      border-radius:var(--radius);
      box-shadow: var(--shadow-soft);
    }
    @media (min-width:480px){
      .hero-meta{font-size:10px; gap:6px; padding:14px 14px 14px 18px;}
    }
    @media (min-width:640px){
      .hero-meta{font-size:12.5px; padding:24px 24px 24px 28px; gap:12px;}
    }
    .hero-meta a{text-decoration:none; color:var(--ink); border-bottom:1px solid var(--ink-faint);}
    .hero-meta a:hover{border-color:var(--gold); color:var(--gold);}
    .hero-meta .row{display:flex; justify-content:space-between; gap:6px; flex-wrap:wrap;}
    .hero-meta .k{color:var(--ink-faint);}

    .hero-cta{margin-top:12px; display:flex; gap:8px; flex-wrap:wrap;}
    @media (min-width:480px){
      .hero-cta{margin-top:16px; gap:10px;}
    }
    @media (min-width:640px){
      .hero-cta{margin-top:28px; gap:14px;}
    }
    @media (max-width:380px){
      .hero-cta .btn{width:100%; text-align:center; justify-content:center;}
    }
    .btn{
      font-family:var(--font-mono); font-size:9px; text-decoration:none;
      padding:6px 14px; border-radius:30px; letter-spacing:.04em;
      transition:all .25s; cursor:pointer; border:none;
      display:inline-flex; align-items:center; justify-content:center;
      font-weight:500;
      -webkit-touch-callout:none;
      touch-action:manipulation;
      min-height:32px;
    }
    @media (min-width:480px){
      .btn{font-size:10px; padding:8px 16px; min-height:36px;}
    }
    @media (min-width:640px){
      .btn{font-size:12.5px; padding:12px 24px; min-height:44px;}
    }
    .btn:active{transform:scale(0.96);}
    .btn-primary{background:var(--gold); color:#FFFFFF; box-shadow:0 2px 8px rgba(198,155,74,0.25);}
    .btn-primary:hover{background:#b0883a; transform:translateY(-2px); box-shadow:0 8px 20px rgba(198,155,74,0.3);}
    .btn-ghost{border:1px solid var(--line); color:var(--ink); background:var(--surface);}
    .btn-ghost:hover{border-color:var(--gold); color:var(--gold); background:var(--surface-2); transform:translateY(-2px);}

    /* ---------- TICKER ---------- */
    .ticker{
      background:var(--surface);
      border-bottom:1px solid var(--line);
      overflow:hidden;
      white-space:nowrap;
      position:relative;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
    }
    .ticker::before, .ticker::after{
      content:""; position:absolute; top:0; bottom:0; width:20px; z-index:2;
      pointer-events:none;
    }
    @media (min-width:480px){
      .ticker::before, .ticker::after{width:30px;}
    }
    @media (min-width:640px){
      .ticker::before, .ticker::after{width:60px;}
    }
    .ticker::before{left:0; background:linear-gradient(90deg, var(--surface), transparent);}
    .ticker::after{right:0; background:linear-gradient(-90deg, var(--surface), transparent);}
    .ticker-track{
      display:inline-flex; align-items:center;
      animation:scroll-ticker 38s linear infinite;
      padding:4px 0;
    }
    @media (min-width:480px){
      .ticker-track{padding:6px 0;}
    }
    @media (min-width:640px){
      .ticker-track{padding:12px 0;}
    }
    .ticker:hover .ticker-track{animation-play-state:paused;}
    .ticker-item{
      font-family:var(--font-mono); font-size:7px; letter-spacing:.03em;
      color:var(--ink-dim); padding:0 6px; display:inline-flex; align-items:center; gap:3px;
      white-space:nowrap;
    }
    @media (min-width:480px){
      .ticker-item{font-size:8px; padding:0 10px; gap:5px;}
    }
    @media (min-width:640px){
      .ticker-item{font-size:12px; padding:0 24px; gap:10px;}
    }
    .ticker-item .dot{width:2px; height:2px; border-radius:50%; background:var(--mint); display:inline-block; flex-shrink:0;}
    @media (min-width:480px){
      .ticker-item .dot{width:3px; height:3px;}
    }
    @media (min-width:640px){
      .ticker-item .dot{width:5px; height:5px;}
    }
    @keyframes scroll-ticker{
      from{transform:translateX(0);}
      to{transform:translateX(-50%);}
    }

    /* ---------- TAB PANELS ---------- */
    .tab-panels{ }
    .tab-panel{
      padding:16px 0;
      opacity:1; transform:translateY(0);
      transition:opacity .35s ease, transform .35s ease;
    }
    @media (min-width:480px){
      .tab-panel{padding:24px 0;}
    }
    @media (min-width:640px){
      .tab-panel{padding:48px 0;}
    }
    @media (min-width:1024px){
      .tab-panel{padding:72px 0;}
    }
    .tab-panel[hidden]{display:none;}
    .tab-panel.fade-out{opacity:0; transform:translateY(12px);}
    .tab-panel.fade-in-prep{opacity:0; transform:translateY(12px); transition:none;}
    @media (prefers-reduced-motion: reduce){
      .tab-panel{transition:none;}
    }
    .section-head{
      display:flex; align-items:baseline; justify-content:space-between;
      margin-bottom:12px; flex-wrap:wrap; gap:4px;
    }
    @media (min-width:480px){
      .section-head{margin-bottom:16px; gap:6px;}
    }
    @media (min-width:640px){
      .section-head{margin-bottom:32px; gap:12px;}
    }
    @media (min-width:1024px){
      .section-head{margin-bottom:40px;}
    }
    .section-head h2{
      font-family:var(--font-display); font-weight:600;
      font-size:clamp(18px,2.5vw,36px);
      color:var(--ink);
      letter-spacing:-.01em;
    }
    @media (min-width:480px){
      .section-head h2{font-size:clamp(20px,3vw,36px);}
    }
    .section-head .idx{
      font-family:var(--font-mono); font-size:7px; color:var(--ink-faint);
      background:var(--surface-2); padding:2px 6px; border-radius:20px;
      white-space:nowrap;
    }
    @media (min-width:480px){
      .section-head .idx{font-size:8px; padding:2px 8px;}
    }
    @media (min-width:640px){
      .section-head .idx{font-size:11px; padding:4px 12px;}
    }

    /* ---------- ABOUT (includes hero) ---------- */
    #about .about-content{
      display:grid; grid-template-columns:1fr; gap:16px;
      padding-top:16px;
      border-top:1px solid var(--line);
    }
    @media (min-width:480px){
      #about .about-content{gap:20px; padding-top:20px;}
    }
    @media (min-width:800px){ 
      #about .about-content{grid-template-columns:2fr 1fr; gap:32px; padding-top:32px;} 
    }
    @media (min-width:1024px){
      #about .about-content{gap:48px; padding-top:32px;}
    }
    #about .about-content p{color:var(--ink-dim); font-size:12px; max-width:64ch;}
    @media (min-width:480px){
      #about .about-content p{font-size:13px;}
    }
    @media (min-width:640px){
      #about .about-content p{font-size:16px;}
    }
    #about .about-content p + p{margin-top:8px;}
    @media (min-width:480px){
      #about .about-content p + p{margin-top:10px;}
    }
    @media (min-width:640px){
      #about .about-content p + p{margin-top:16px;}
    }

    /* ---------- EXPERIENCE ---------- */
    .role{
      display:grid; grid-template-columns:1fr; gap:3px;
      padding:10px 0; border-top:1px solid var(--line);
      text-align: left;
      transition: background .2s;
      border-radius:var(--radius);
      padding-left:4px; padding-right:4px;
    }
    @media (min-width:480px){
      .role{padding:14px 0; gap:4px;}
    }
    @media (min-width:700px){
      .role{grid-template-columns:140px 1fr; gap:32px; padding:28px 8px;}
    }
    .role:hover{ background:var(--surface); box-shadow: var(--shadow-soft); }
    .role:last-child{border-bottom:1px solid var(--line);}
    .role .when{
      font-family:var(--font-mono); font-size:8px; color:var(--gold);
      letter-spacing:.03em;
    }
    @media (min-width:480px){
      .role .when{font-size:9px;}
    }
    @media (min-width:700px){
      .role .when{font-size:12px;}
    }
    .role .who{
      font-family:var(--font-display); font-size:14px; font-weight:600; margin-bottom:1px;
    }
    @media (min-width:480px){
      .role .who{font-size:16px;}
    }
    @media (min-width:700px){
      .role .who{font-size:20px; margin-bottom:2px;}
    }
    .role .where{
      font-family:var(--font-mono); font-size:8px; color:var(--ink-faint);
      margin-bottom:4px; display:block;
    }
    @media (min-width:480px){
      .role .where{font-size:9px; margin-bottom:6px;}
    }
    @media (min-width:700px){
      .role .where{font-size:12px; margin-bottom:12px;}
    }
    .role ul{list-style:none; display:flex; flex-direction:column; gap:3px;}
    @media (min-width:480px){
      .role ul{gap:4px;}
    }
    @media (min-width:700px){
      .role ul{gap:8px;}
    }
    .role li{
      color:var(--ink-dim); font-size:11px; padding-left:12px; position:relative;
      text-align: left;
    }
    @media (min-width:480px){
      .role li{font-size:12px; padding-left:14px;}
    }
    @media (min-width:700px){
      .role li{font-size:14.5px; padding-left:20px;}
    }
    .role li::before{
      content:"—"; position:absolute; left:0; color:var(--gold); opacity:0.6;
    }

    /* ---------- EDUCATION ---------- */
    .edu-list{display:flex; flex-direction:column;}
    .edu-item{
      display:grid; grid-template-columns:1fr; gap:2px;
      padding:8px 0; border-top:1px solid var(--line);
      text-align: left;
      transition: background .2s;
      border-radius:var(--radius);
      padding-left:4px; padding-right:4px;
    }
    @media (min-width:480px){
      .edu-item{padding:10px 0; gap:3px;}
    }
    @media (min-width:700px){
      .edu-item{grid-template-columns:140px 1fr auto; gap:24px; padding:16px 8px;}
    }
    .edu-item:hover{ background:var(--surface); box-shadow: var(--shadow-soft); }
    .edu-item:last-child{border-bottom:1px solid var(--line);}
    .edu-item .when{font-family:var(--font-mono); font-size:8px; color:var(--gold);}
    @media (min-width:480px){
      .edu-item .when{font-size:9px;}
    }
    @media (min-width:700px){
      .edu-item .when{font-size:12px;}
    }
    .edu-item .deg{font-weight:600; font-size:11px;}
    @media (min-width:480px){
      .edu-item .deg{font-size:12px;}
    }
    @media (min-width:700px){
      .edu-item .deg{font-size:15px;}
    }
    .edu-item .inst{color:var(--ink-dim); font-size:9px; display:block; margin-top:1px;}
    @media (min-width:480px){
      .edu-item .inst{font-size:10px; margin-top:2px;}
    }
    @media (min-width:700px){
      .edu-item .inst{font-size:13px; margin-top:2px;}
    }
    .edu-item .grade{
      font-family:var(--font-mono); font-size:7px; color:var(--ink-faint);
      justify-self:start; white-space:nowrap;
      background:var(--surface-2); padding:1px 6px; border-radius:20px;
      margin-top:2px;
    }
    @media (min-width:480px){
      .edu-item .grade{font-size:8px; padding:2px 8px;}
    }
    @media (min-width:700px){
      .edu-item .grade{justify-self:end; font-size:11px; margin-top:0; padding:2px 12px;}
    }

    .cert-note{
      margin-top:12px; padding:8px 12px; background:var(--surface);
      border-left:3px solid var(--gold); font-size:10px; color:var(--ink-dim);
      border-radius:0 var(--radius) var(--radius) 0;
      box-shadow: var(--shadow-soft);
      text-align: left;
    }
    @media (min-width:480px){
      .cert-note{padding:10px 14px; font-size:11px; margin-top:16px;}
    }
    @media (min-width:640px){
      .cert-note{padding:16px 24px; font-size:14px; margin-top:28px;}
    }
    .cert-note strong{color:var(--ink);}

    /* ---------- SKILL CHART ---------- */
    .skill-chart-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    @media (min-width:480px) {
      .skill-chart-grid {gap: 20px;}
    }
    @media (min-width:700px) {
      .skill-chart-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 40px 56px;
      }
    }
    .skill-chart-group h3 {
      font-family: var(--font-mono);
      font-size: 8px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--gold);
      margin-bottom: 8px;
      padding-bottom: 3px;
      border-bottom: 2px solid var(--gold-soft);
      text-align: left;
    }
    @media (min-width:480px){
      .skill-chart-group h3{font-size:9px; margin-bottom:10px; padding-bottom:4px;}
    }
    @media (min-width:640px){
      .skill-chart-group h3{font-size:12px; margin-bottom:20px; padding-bottom:8px;}
    }
    .skill-bar {
      display: grid;
      grid-template-columns: 1fr 2fr;
      align-items: center;
      gap: 4px;
      margin-bottom: 5px;
      text-align: left;
    }
    @media (min-width:480px) {
      .skill-bar {
        grid-template-columns: 1fr 2fr;
        gap: 5px;
        margin-bottom: 6px;
      }
    }
    @media (min-width:640px) {
      .skill-bar {
        grid-template-columns: 1fr 3fr;
        gap: 10px;
        margin-bottom: 10px;
      }
    }
    @media (max-width:380px) {
      .skill-bar {
        grid-template-columns: 1fr;
        gap: 2px;
      }
    }
    .skill-label {
      font-family: var(--font-body);
      font-size: 9px;
      font-weight: 500;
      color: var(--ink);
      text-align: left;
    }
    @media (min-width:480px){
      .skill-label{font-size:10px;}
    }
    @media (min-width:640px){
      .skill-label{font-size:13px;}
    }
    .bar-track {
      width: 100%;
      height: 3px;
      background-color: var(--surface-2);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
    }
    @media (min-width:480px){
      .bar-track{height:4px;}
    }
    @media (min-width:640px){
      .bar-track{height:8px;}
    }
    .bar-fill {
      height: 100%;
      border-radius: 20px;
      background: linear-gradient(90deg, var(--gold-soft), var(--gold));
      transition: width 0.8s ease-out;
      width: 0;
    }
    .bar-fill:hover {
      filter: brightness(1.05);
    }

    /* ---------- CONTACT ---------- */
    .contact-grid{
      display:grid; grid-template-columns:1fr; gap:16px; align-items:start;
    }
    @media (min-width:480px){ .contact-grid{gap:20px;} }
    @media (min-width:800px){ .contact-grid{grid-template-columns:1.3fr 1fr; gap:40px;} }
    @media (min-width:1024px){ .contact-grid{gap:56px;} }
    .contact h2{
      font-family:var(--font-display); font-weight:600;
      font-size:clamp(18px,3vw,44px); line-height:1.15; margin-bottom:8px;
      text-align: left;
    }
    @media (min-width:480px){
      .contact h2{font-size:clamp(20px,3.5vw,44px); margin-bottom:10px;}
    }
    @media (min-width:640px){
      .contact h2{margin-bottom:16px;}
    }
    .contact p{color:var(--ink-dim); max-width:48ch; margin-bottom:12px; text-align: left; font-size:12px;}
    @media (min-width:480px){
      .contact p{font-size:13px; margin-bottom:16px;}
    }
    @media (min-width:640px){
      .contact p{font-size:16px; margin-bottom:28px;}
    }
    .contact-list{display:flex; flex-direction:column; gap:0;}
    .contact-list a{
      display:flex; justify-content:space-between; align-items:center;
      padding:8px 0; border-top:1px solid var(--line);
      text-decoration:none; font-family:var(--font-mono); font-size:9px;
      color:var(--ink); transition:all .25s;
      text-align: left;
      padding-left:4px; padding-right:4px;
      border-radius:var(--radius);
      gap:6px;
      min-height:40px;
      -webkit-touch-callout:none;
      touch-action:manipulation;
    }
    @media (min-width:480px){
      .contact-list a{font-size:10px; padding:10px 0; min-height:44px;}
    }
    @media (min-width:640px){
      .contact-list a{font-size:13.5px; padding:18px 8px; min-height:auto;}
    }
    .contact-list a:active{background:var(--surface-2);}
    .contact-list a:hover{ background:var(--surface); box-shadow: var(--shadow-soft); color:var(--gold); }
    .contact-list a:last-child{border-bottom:1px solid var(--line);}
    .contact-list .k{color:var(--ink-faint); font-size:7px; text-transform:uppercase; letter-spacing:.05em; display:block;}
    @media (min-width:480px){
      .contact-list .k{font-size:8px;}
    }
    @media (min-width:640px){
      .contact-list .k{font-size:11px;}
    }
    .contact-list .arrow{opacity:0; transition:all .25s; transform:translateX(-6px);}
    .contact-list a:hover .arrow{opacity:1; transform:translateX(0);}

    footer{
      padding:12px 0 16px;
      font-family:var(--font-mono); font-size:7px; color:var(--ink-faint);
      display:flex; justify-content:space-between; flex-wrap:wrap; gap:3px;
      border-top:1px solid var(--line);
      text-align: left;
    }
    @media (min-width:480px){
      footer{font-size:8px; padding:16px 0 20px; gap:4px;}
    }
    @media (min-width:640px){
      footer{font-size:11.5px; padding:28px 0 40px; gap:8px;}
    }

    /* ---------- SCROLLBAR STYLING ---------- */
    ::-webkit-scrollbar {width:4px; height:4px;}
    ::-webkit-scrollbar-track {background:var(--bg);}
    ::-webkit-scrollbar-thumb {background:var(--gold-soft); border-radius:10px;}
    ::-webkit-scrollbar-thumb:hover {background:var(--gold);}
  </style>
</head>
